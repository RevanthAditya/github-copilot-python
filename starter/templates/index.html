<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>

  <div class="controls">
    <label for="difficulty-select">Difficulty</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <span id="timer" class="status-pill">00:00</span>
    <span id="hints-used" class="status-pill">Hints Used: 0</span>
    <button id="new-game">New Game</button>
    <button id="hint-button" type="button">Hint</button>
    <button id="check-solution" type="button">Check</button>
    <button id="theme-toggle" type="button" aria-label="Toggle dark and light mode">Dark Mode</button>
    <span id="message"></span>
  </div>

  <div id="sudoku-board"></div>

  <section class="scoreboard-panel" aria-label="Top 10 fastest times scoreboard">
    <h2>Top 10 Fastest Times</h2>
    <table id="scoreboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Time</th>
          <th>Level</th>
          <th>Hints</th>
        </tr>
      </thead>
      <tbody id="scoreboard-body"></tbody>
    </table>
  </section>

  <script src="/static/main.js"></script>
</body>
</html>
